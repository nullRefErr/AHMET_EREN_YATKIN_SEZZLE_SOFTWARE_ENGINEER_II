server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # The API is served from the same origin as the app, so the browser never makes a
    # cross-origin request and CORS never enters the picture.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed asset filenames change whenever their contents do, so they can be cached
    # indefinitely; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A single-page app owns its own routing: unknown paths return the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
