name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # G-1
      - name: Vet
        run: go vet ./...

      # G-2
      # Pinned: the action's default is not guaranteed to understand a v2 config, and a
      # golangci-lint built against an older Go refuses this module's language version.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: backend

      # G-3 — the race detector is the point; the cache is written from concurrent handlers.
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

      # CI-2 — -trimpath keeps the build reproducible, and the commit is stamped into the
      # binary so a deployed build can be traced back to its source.
      - name: Build
        run: go build -trimpath -ldflags="-X main.version=${GITHUB_SHA}" ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # The version comes from frontend/package.json's packageManager field, so CI and a
      # local checkout cannot drift apart.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Build
        run: pnpm build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The reviewer's first command is "docker compose up --build". If that cannot be
      # built here, it will not work for them either.
      - name: Build images
        run: docker compose build
